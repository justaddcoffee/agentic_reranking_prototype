[project]
name = "agentic-reranking"
version = "0.1.0"
description = "Pilot benchmark measuring whether agentic AI improves Exomiser's differential diagnosis on a post-cutoff rare-disease cohort."
authors = [
    { name = "Justin Reese", email = "justaddcoffee+github@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.87",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "phenopackets>=2.0.2.post5",
    "pyobo>=0.12.18",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "tenacity>=9.1.4",
    # pheval is added in Task 9 (Exomiser pipeline). It has a transitive
    # build-time dependency on Apache ant which not all dev hosts have.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260408",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
